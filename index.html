<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Vault</title>
  <style>
    :root {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-field: #0f172a;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.35;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px;
    }

    /* PIN Lock Screen */
    .lock-screen {
      max-width: 340px;
      margin: 60px auto 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }

    .lock-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display: grid;
      place-items: center;
      font-size: 20px;
      margin: 0 auto 12px;
    }

    .lock-screen h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .lock-screen p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .pin-input {
      width: 100%;
      background: var(--bg-body);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1.25rem;
      letter-spacing: 0.35em;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      outline: none;
      margin-bottom: 12px;
    }

    .pin-input:focus {
      border-color: var(--primary);
    }

    .btn-unlock {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-unlock:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.78rem;
      margin-top: 10px;
      min-height: 18px;
    }

    /* Main App UI */
    #vaultApp {
      display: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      font-size: 0.7rem;
      color: var(--success);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    .btn-lock {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .tabs-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 7px 4px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px var(--primary-glow);
    }

    .dropdown-box {
      position: relative;
      margin-bottom: 12px;
    }

    .dropdown-box select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      padding: 10px 36px 10px 12px;
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
    }

    .dropdown-box::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 9px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-row {
      background: var(--bg-field);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field-info {
      min-width: 0;
      flex: 1;
    }

    .field-label {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .field-value {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-all;
    }

    .masked {
      filter: blur(5px);
      user-select: none;
    }

    .field-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .action-btn:active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--primary);
      color: #fff;
    }

    .state-box {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px dashed var(--border);
      font-size: 0.82rem;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--success);
      color: #022c22;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 7px 16px;
      border-radius: 99px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PIN Lock Screen -->
    <div id="lockScreen" class="lock-screen">
      <div class="lock-icon">🛡️</div>
      <h2>Vault Locked</h2>
      <p>Enter your master PIN to decrypt keys</p>
      <form onsubmit="unlockVault(event)">
        <input type="password" id="pinInput" class="pin-input" placeholder="••••" required autofocus>
        <button type="submit" id="unlockBtn" class="btn-unlock">Unlock Vault</button>
      </form>
      <div id="errorMsg" class="error-msg"></div>
    </div>

    <!-- Main Vault App -->
    <div id="vaultApp">
      <header>
        <div class="brand">
          <div class="brand-badge">🔐</div>
          <h1>Secure Vault</h1>
        </div>
        <div class="header-right">
          <span class="status-pill" id="countBadge">0 Keys</span>
          <button class="btn-lock" onclick="lockVault()" title="Lock Vault">🔒 Lock</button>
        </div>
      </header>

      <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" onclick="switchTab('General', this)">General</button>
        <button class="tab-btn" onclick="switchTab('Finance', this)">Finance</button>
        <button class="tab-btn" onclick="switchTab('Cards & Pay', this)">Cards & Pay</button>
        <button class="tab-btn" onclick="switchTab('School admn.', this)">School admn.</button>
      </div>

      <div class="dropdown-box">
        <select id="itemSelect" onchange="renderSelectedCard()">
          <option value="">-- Select credential --</option>
        </select>
      </div>

      <div id="placeholder" class="state-box">
        Select an item from the dropdown above to view credentials.
      </div>

      <div id="cardContainer"></div>
    </div>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygGruOgQp5O4vkoad-IwFe8iflfC5WX0mAqgVxjdJlAuaRK4BPifb4GKnlp2QlYpSr/exec";

    let masterData = {};
    let currentTab = 'General';

    async function unlockVault(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('unlockBtn');
      const errEl = document.getElementById('errorMsg');

      if (!pin) return;

      btn.disabled = true;
      btn.textContent = "Verifying...";
      errEl.textContent = "";

      try {
        const response = await fetch(`${SCRIPT_URL}?pin=${encodeURIComponent(pin)}`);
        const result = await response.json();

        if (result.status === "success") {
          masterData = result.data || {};
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('vaultApp').style.display = 'block';
          updateDropdown();
        } else {
          errEl.textContent = "❌ Incorrect PIN. Access denied.";
          document.getElementById('pinInput').value = "";
          document.getElementById('pinInput').focus();
        }
      } catch (err) {
        errEl.textContent = "⚠️ Connection error. Check Script URL.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Unlock Vault";
      }
    }

    function lockVault() {
      masterData = {};
      document.getElementById('pinInput').value = "";
      document.getElementById('cardContainer').innerHTML = "";
      document.getElementById('vaultApp').style.display = 'none';
      document.getElementById('lockScreen').style.display = 'block';
      document.getElementById('pinInput').focus();
    }

    function switchTab(tabName, btnEl) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      updateDropdown();
      document.getElementById('cardContainer').innerHTML = '';
      document.getElementById('placeholder').style.display = 'block';
    }

    function updateDropdown() {
      const select = document.getElementById('itemSelect');
      const data = masterData[currentTab] || [];
      
      document.getElementById('countBadge').textContent = `${data.length} Keys`;
      select.innerHTML = `<option value="">-- Select from ${currentTab} (${data.length}) --</option>`;
      
      data.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = item.subject || `Item #${item.sno}`;
        select.appendChild(option);
      });
    }

    function renderSelectedCard() {
      const index = document.getElementById('itemSelect').value;
      const cardContainer = document.getElementById('cardContainer');
      const placeholder = document.getElementById('placeholder');
      
      cardContainer.innerHTML = '';

      if (index === "") {
        placeholder.style.display = 'block';
        return;
      }

      placeholder.style.display = 'none';
      const item = masterData[currentTab][index];

      const card = document.createElement('div');
      card.className = 'card';
      
      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">${escapeHTML(item.subject || 'N/A')}</span>
          <span class="badge">#${escapeHTML(String(item.sno || '-'))}</span>
        </div>
        <div class="card-body">
          ${buildFieldRow('Account / Card No', item.accountNo, false, 'f-acc')}
          ${buildFieldRow('User ID / Login', item.userId, false, 'f-uid')}
          ${buildFieldRow('Password', item.password, true, 'f-pwd')}
          ${buildFieldRow('Profile / PIN', item.profilePassword, true, 'f-pin')}
        </div>
      `;
      cardContainer.appendChild(card);
    }

    function buildFieldRow(label, value, isSecret, id) {
      const val = value ? String(value) : '-';
      const hasVal = val !== '-';
      const maskClass = (isSecret && hasVal) ? 'masked' : '';

      return `
        <div class="field-row">
          <div class="field-info">
            <span class="field-label">${label}</span>
            <span class="field-value ${maskClass}" id="${id}">${escapeHTML(val)}</span>
          </div>
          ${hasVal ? `
            <div class="field-actions">
              ${isSecret ? `<button class="action-btn" title="Show/Hide" onclick="toggleMask('${id}')">👁️</button>` : ''}
              <button class="action-btn" title="Copy" onclick="copyValue('${escapeQuotes(val)}', '${label}')">📋</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleMask(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('masked');
    }

    function copyValue(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} copied!`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    function escapeQuotes(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
